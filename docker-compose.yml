services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
      - ./PCB_USED:/app/PCB_USED:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ui:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./model:/app/model:ro
      - ./PCB_USED:/app/PCB_USED:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
