[project]
name = "pcb-defect-detection"
version = "1.0.0"
description = "PCB defect detection and classification with ResNet-50 and SSIM."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "streamlit>=1.30",
    "Pillow>=10.0",
    "numpy>=1.24",
    "imagehash>=4.3",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "imagehash",
    "skimage.*",
    "torchvision.*",
    "streamlit.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
